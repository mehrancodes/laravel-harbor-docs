<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">How Harbor splits clone vs API</title>
  <desc id="desc">FORGE_GIT_PROVIDER tells Forge how to clone. FORGE_GIT_API_PROVIDER optionally tells Harbor which Git API to use for deploy keys and comments.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="720" height="280" fill="#f8fafc" rx="12"/>

  <!-- Harbor box -->
  <rect x="40" y="90" width="140" height="70" rx="10" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="110" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Harbor</text>

  <!-- Left path: clone -->
  <line x1="180" y1="110" x2="280" y2="60" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="290" y="28" width="220" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="54" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#1d4ed8">FORGE_GIT_PROVIDER</text>
  <text x="400" y="74" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1e3a8a">how Forge clones the repo</text>

  <line x1="510" y1="60" x2="580" y2="60" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="590" y="35" width="100" height="50" rx="10" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="640" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Forge</text>

  <!-- Right path: API -->
  <line x1="180" y1="140" x2="280" y2="190" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="290" y="158" width="220" height="64" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="400" y="184" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#15803d">FORGE_GIT_API_PROVIDER</text>
  <text x="400" y="204" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#14532d">optional · deploy keys &amp; comments</text>

  <line x1="510" y1="190" x2="580" y2="190" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="590" y="165" width="100" height="50" rx="10" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="640" y="187" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">GitHub /</text>
  <text x="640" y="204" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">GitLab API</text>

  <text x="360" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">If FORGE_GIT_API_PROVIDER is unset, Harbor uses FORGE_GIT_PROVIDER.</text>
</svg>
